name = "yellow-pearl-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "e1b3f72b4806b9ee6db348e090df9590"

# Pages公開後にドメインを設定する（例: https://yellow-pearl.pages.dev）
[vars]
ALLOWED_ORIGIN = "*"

# KOMOJU（ホストページ）:
#   wrangler secret put KOMOJU_SECRET_KEY
#   wrangler secret put KOMOJU_WEBHOOK_SECRET
# Webhook URL: https://yellow-pearl.com/api/reserve
#   wrangler secret put SITE_PASSWORD
# 未設定なら認証なし。ユーザー名は任意、パスワードのみ照合。
# Pages 側も同じ変数名 SITE_PASSWORD を環境変数で設定すること。

[[routes]]
pattern = "yellow-pearl.com/*"
zone_name = "yellow-pearl.com"

[[routes]]
pattern = "www.yellow-pearl.com/*"
zone_name = "yellow-pearl.com"

# 管理者API: Cloudflare Zero Trust Access（/api/admin/*）
# [vars] ACCESS_AUD = "<Access Application の AUD tag>"

[[d1_databases]]
binding = "DB"
database_name = "yellow-pearl-db"
database_id = "83ca742c-5668-4f55-8385-9de1a6d027e1"
