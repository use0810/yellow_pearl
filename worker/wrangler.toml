name = "yellow-pearl-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "e1b3f72b4806b9ee6db348e090df9590"

# Pages公開後にドメインを設定する（例: https://yellow-pearl.pages.dev）
[vars]
ALLOWED_ORIGINS = "https://yellow-pearl.com,https://www.yellow-pearl.com"
# 管理画面ログイン許可（カンマ区切り）。Access ポリシーと Worker の二重チェック
ADMIN_ALLOWED_EMAILS = "shingo.satokimi2021@gmail.com"
# 購入通知メールの宛先（カンマ区切り）。ログイン許可とは別。未設定時は ADMIN_ALLOWED_EMAILS の先頭へ送る
ADMIN_NOTIFY_EMAILS = "shingo.satokimi2021@gmail.com"

[triggers]
crons = ["0 18 * * *"]

# Stripe Checkout（テスト）:
#   wrangler secret put STRIPE_SECRET_KEY          # sk_test_...
#   wrangler secret put STRIPE_WEBHOOK_SECRET        # テスト Webhook の whsec_...
# Stripe Checkout（本番）:
#   wrangler secret put STRIPE_SECRET_KEY_LIVE       # sk_live_...
#   wrangler secret put STRIPE_WEBHOOK_SECRET_LIVE   # 本番 Webhook の whsec_...
# 管理画面の「Stripe 決済モード」で test/live を切り替え（デフォルト test）
# Webhook URL（テスト・本番とも同一）: https://yellow-pearl.com/api/reserve

[[routes]]
pattern = "yellow-pearl.com/*"
zone_name = "yellow-pearl.com"

[[routes]]
pattern = "www.yellow-pearl.com/*"
zone_name = "yellow-pearl.com"

# 管理画面: Cloudflare Access（メール OTP / ワンタイム PIN）必須
# 1) Zero Trust → Integrations → Identity providers → One-time PIN を追加
# 2) Access → Applications → Add application（Self-hosted）
#    - yellow-pearl.com/admin.html
#    - yellow-pearl.com/api/admin/*
#    Identity: One-time PIN のみ
#    Policy: Allow → Emails → shingo.satokimi2021@gmail.com
# 3) Application の AUD をコピーし、Team domain を確認（Settings → Custom pages）
#    wrangler secret put ACCESS_TEAM_DOMAIN   # 例: xxx.cloudflareaccess.com
#    wrangler secret put ACCESS_AUD           # Application の AUD tag

[[d1_databases]]
binding = "DB"
database_name = "yellow-pearl-db"
database_id = "83ca742c-5668-4f55-8385-9de1a6d027e1"

# Email Sending（予約確認・キャンセル通知）:
#   Dashboard → Email Service → Email Sending → yellow-pearl.com をオンボード
#   送信元: info@yellow-pearl.com（オンボード済みドメイン内のアドレス）
[[send_email]]
name = "EMAIL"
