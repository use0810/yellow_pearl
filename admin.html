<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>管理画面 | Yellow Pearl</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: #1a1a1a;
        background: #f0f2f5;
      }

      .admin-app {
        min-height: 100vh;
        display: flex;
      }

      /* ── ナビ（PC: 左サイド） ── */
      .desktop-nav {
        display: none;
        width: 200px;
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid #e0e0e0;
        padding: 1.25rem 0;
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .nav-brand {
        padding: 0 1.25rem 1.25rem;
        font-size: 0.8rem;
        font-weight: 700;
        color: #666;
        border-bottom: 1px solid #eee;
        margin-bottom: 0.75rem;
      }

      .nav-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.85rem 1.25rem;
        border: none;
        background: none;
        font-size: 0.95rem;
        color: #444;
        cursor: pointer;
        border-left: 3px solid transparent;
      }

      .nav-btn:hover { background: #f5f5f5; }

      .nav-btn.active {
        background: #eff6ff;
        color: #1d4ed8;
        font-weight: 600;
        border-left-color: #1d4ed8;
      }

      /* ── ナビ（スマホ: 下タブ） ── */
      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid #e0e0e0;
        z-index: 100;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }

      .mobile-nav .nav-btn {
        flex: 1;
        text-align: center;
        padding: 0.75rem 0.35rem 0.65rem;
        border-left: none;
        border-top: 3px solid transparent;
        font-size: 0.75rem;
      }

      .mobile-nav .nav-btn.active {
        border-left: none;
        border-top-color: #1d4ed8;
      }

      /* ── メイン ── */
      .admin-main {
        flex: 1;
        min-width: 0;
        padding: 1rem 1rem 5rem;
      }

      @media (min-width: 768px) {
        .desktop-nav { display: block; }
        .mobile-nav { display: none; }
        .admin-main { padding: 1.5rem 2rem 2rem; }
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .topbar h1 {
        font-size: 1.15rem;
        font-weight: 700;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .badge {
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
      }

      .badge.sold-out {
        background: #fee2e2;
        color: #991b1b;
      }

      .btn {
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fff;
        color: #333;
        cursor: pointer;
      }

      .btn:hover:not(:disabled) { background: #f5f5f5; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .btn-primary {
        background: #1d4ed8;
        color: #fff;
        border-color: #1d4ed8;
      }

      .btn-primary:hover:not(:disabled) { background: #1e40af; }

      .btn-danger {
        background: #fee2e2;
        color: #991b1b;
        border-color: #fecaca;
      }

      .btn-danger:hover:not(:disabled) { background: #fecaca; }

      .screen { display: none; }
      .screen.active { display: block; }

      .card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
      }

      .card-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: #555;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #eee;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      @media (min-width: 600px) {
        .stats-grid { grid-template-columns: repeat(3, 1fr); }
      }

      .stat-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 1rem;
        text-align: center;
      }

      .stat-num {
        font-size: 1.6rem;
        font-weight: 700;
        color: #1d4ed8;
        line-height: 1.2;
      }

      .stat-label {
        font-size: 0.75rem;
        color: #888;
        margin-top: 0.25rem;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      @media (max-width: 500px) {
        .form-row { grid-template-columns: 1fr; }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-bottom: 1rem;
      }

      .field label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #555;
      }

      .field input[type="number"] {
        font-size: 1rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        width: 100%;
      }

      .field input:focus {
        outline: 2px solid #93c5fd;
        border-color: #1d4ed8;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }

      .msg-error { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; }
      .msg-success { color: #16a34a; font-size: 0.85rem; margin-top: 0.5rem; }

      /* 顧客テーブル（PC） */
      .table-wrap { overflow-x: auto; }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      .data-table th,
      .data-table td {
        padding: 0.6rem 0.5rem;
        border-bottom: 1px solid #eee;
        text-align: left;
        vertical-align: top;
      }

      .data-table th {
        font-size: 0.75rem;
        font-weight: 700;
        color: #666;
        white-space: nowrap;
        background: #fafafa;
      }

      .data-table .mono {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }

      /* 顧客カード（スマホ） */
      .order-cards { display: none; }

      @media (max-width: 767px) {
        .table-wrap { display: none; }
        .order-cards { display: flex; flex-direction: column; gap: 0.75rem; }
      }

      .order-card {
        border: 1px solid #e8e8e8;
        border-radius: 8px;
        padding: 1rem;
        background: #fafafa;
      }

      .order-card-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .order-card-name {
        font-weight: 700;
        font-size: 1rem;
      }

      .order-card-id {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: #888;
      }

      .order-card-dl {
        display: grid;
        grid-template-columns: 4.5rem 1fr;
        gap: 0.2rem 0.5rem;
        font-size: 0.85rem;
      }

      .order-card-dl dt { color: #888; }
      .order-card-dl dd { word-break: break-all; }

      .empty-msg {
        color: #999;
        text-align: center;
        padding: 2rem 1rem;
        font-size: 0.9rem;
      }

      #auth-error {
        display: none;
        max-width: 480px;
        margin: 4rem auto;
        padding: 2rem;
        background: #fff;
        border: 1px solid #fecaca;
        border-radius: 8px;
        text-align: center;
      }

      #auth-error .msg-error { margin-top: 0; font-size: 1rem; }

      .card-note {
        font-size: 0.8rem;
        color: #888;
        margin-bottom: 1rem;
      }

      /* 棒グラフ */
      .bar-chart {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: clamp(0.75rem, 3vw, 2rem);
        min-height: 220px;
        padding: 1rem 0.5rem 0;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #eee;
      }

      .bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        max-width: 80px;
        min-width: 48px;
      }

      .bar-count {
        font-size: 0.75rem;
        font-weight: 700;
        color: #1d4ed8;
        margin-bottom: 0.35rem;
        min-height: 1.1rem;
      }

      .bar-pillar {
        width: 100%;
        max-width: 48px;
        background: #1d4ed8;
        border-radius: 4px 4px 0 0;
        min-height: 4px;
        transition: height 0.3s ease;
      }

      .bar-year {
        font-size: 0.8rem;
        font-weight: 600;
        color: #555;
        margin-top: 0.5rem;
      }

      .data-table .num { text-align: right; white-space: nowrap; }

      .shipping-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.65rem;
        margin-bottom: 1rem;
      }

      .shipping-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.85rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid #f0f0f0;
      }

      .shipping-item:last-child {
        border-bottom: none;
      }

      .shipping-item label {
        flex: 1;
        color: #333;
        min-width: 0;
      }

      .shipping-region-name {
        display: block;
        font-weight: 600;
      }

      .shipping-region-prefs {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.72rem;
        color: #888;
        line-height: 1.35;
      }

      .shipping-item input {
        width: 88px;
        flex-shrink: 0;
        padding: 0.4rem 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.85rem;
      }

      .card-head-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #eee;
        flex-wrap: wrap;
      }

      .card-head-row .card-title {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      .ops-cell { min-width: 180px; }

      .ops-cell select,
      .ops-cell textarea {
        width: 100%;
        font-size: 0.8rem;
        padding: 0.35rem 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: inherit;
      }

      .ops-cell textarea {
        min-height: 52px;
        resize: vertical;
        margin-top: 0.35rem;
      }

      .ops-save {
        margin-top: 0.35rem;
        font-size: 0.75rem;
        padding: 0.3rem 0.65rem;
      }

      .ops-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .ops-actions .btn {
        font-size: 0.75rem;
        padding: 0.35rem 0.75rem;
      }

      .status-pill {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        margin-bottom: 0.35rem;
      }

      .status-pill.reserved { background: #dbeafe; color: #1d4ed8; }
      .status-pill.done { background: #dcfce7; color: #166534; }
      .status-pill.cancelled { background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <div id="auth-error">
      <p class="msg-error" id="auth-error-msg"></p>
    </div>

    <div class="admin-app" id="app" hidden>
      <nav class="desktop-nav" aria-label="メインメニュー">
        <div class="nav-brand">Yellow Pearl</div>
        <button type="button" class="nav-btn active" data-screen="products">商品管理</button>
        <button type="button" class="nav-btn" data-screen="orders">予約管理</button>
        <button type="button" class="nav-btn" data-screen="stats">統計</button>
      </nav>

      <main class="admin-main">
        <div class="topbar">
          <h1 id="screen-title">商品管理</h1>
          <div class="topbar-actions">
            <span class="badge" id="status-badge">受付中</span>
            <button type="button" class="btn" id="refresh-btn">更新</button>
          </div>
        </div>

        <!-- 商品管理 -->
        <section id="screen-products" class="screen active">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-num" id="stat-sold">—</div>
              <div class="stat-label">売れた本数</div>
            </div>
            <div class="stat-card">
              <div class="stat-num" id="stat-stock">—</div>
              <div class="stat-label">残り在庫</div>
            </div>
            <div class="stat-card">
              <div class="stat-num" id="stat-orders">—</div>
              <div class="stat-label">予約件数</div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">在庫の更新</div>
            <form id="inventory-form">
              <div class="field" style="max-width:240px">
                <label for="edit-stock">残り在庫（本）</label>
                <input type="number" id="edit-stock" min="0" required />
              </div>
              <div class="form-row">
                <div class="field">
                  <label for="edit-unit-price">単価（税抜・円／本）</label>
                  <input type="number" id="edit-unit-price" min="0" required />
                </div>
                <div class="field">
                  <label for="edit-tax-rate">税率（％）</label>
                  <input type="number" id="edit-tax-rate" min="0" max="100" value="10" required />
                </div>
              </div>
              <label class="checkbox-row">
                <input type="checkbox" id="edit-sold-out" />
                受付終了にする
              </label>
              <p class="msg-error" id="inventory-error"></p>
              <p class="msg-success" id="inventory-success"></p>
              <button type="submit" class="btn btn-primary" id="save-btn">在庫・単価を保存</button>
            </form>
          </div>

          <div class="card">
            <div class="card-title">送料（地域別）</div>
            <p class="card-note">金額は税込みで入力。カートの都道府県選択と連動します。</p>
            <form id="shipping-form">
              <div class="shipping-grid" id="shipping-grid"></div>
              <p class="msg-error" id="shipping-error"></p>
              <p class="msg-success" id="shipping-success"></p>
              <button type="submit" class="btn btn-primary" id="save-shipping-btn">送料を保存</button>
            </form>
          </div>
        </section>

        <!-- 予約管理 -->
        <section id="screen-orders" class="screen">
          <div class="card">
            <div class="card-head-row">
              <div class="card-title" id="orders-list-title">予約一覧</div>
              <button type="button" class="btn" id="toggle-orders-filter-btn">キャンセル一覧</button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>予約番号</th>
                    <th>お名前</th>
                    <th>連絡先</th>
                    <th>住所</th>
                    <th>数量</th>
                    <th class="num">合計</th>
                    <th>日時</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="orders-table-body">
                  <tr><td colspan="8" class="empty-msg">読み込み中...</td></tr>
                </tbody>
              </table>
            </div>
            <div class="order-cards" id="orders-cards"></div>
          </div>
        </section>

        <!-- 統計 -->
        <section id="screen-stats" class="screen">
          <div class="card">
            <div class="card-title">年度別予約件数</div>
            <p class="card-note">※ 昨年度までの確定データを表示します（今年度は含みません）</p>
            <div class="bar-chart" id="year-bar-chart">
              <p class="empty-msg">読み込み中...</p>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>年度</th>
                    <th class="num">予約件数</th>
                    <th class="num">合計（本）</th>
                    <th class="num">金額（円）</th>
                  </tr>
                </thead>
                <tbody id="stats-table-body">
                  <tr><td colspan="4" class="empty-msg">読み込み中...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>

      <nav class="mobile-nav" aria-label="メインメニュー">
        <button type="button" class="nav-btn active" data-screen="products">商品</button>
        <button type="button" class="nav-btn" data-screen="orders">予約</button>
        <button type="button" class="nav-btn" data-screen="stats">統計</button>
      </nav>
    </div>

    <script>
      const WORKER_URL = window.location.origin;
      const SCREEN_TITLES = { products: '商品管理', orders: '予約管理', stats: '統計' };
      const ORDER_STATUSES = ['予約', '済み', 'キャンセル'];
      let orderFilter = 'active';
      const SHIPPING_REGIONS = [
        { id: 'hokkaido', name: '北海道', prefectures: ['北海道'] },
        { id: 'okinawa', name: '沖縄', prefectures: ['沖縄県'] },
        { id: 'tohoku', name: '東北地方', prefectures: ['青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県'] },
        { id: 'kanto', name: '関東地方', prefectures: ['茨城県', '栃木県', '群馬県', '埼玉県', '千葉県', '東京都', '神奈川県'] },
        { id: 'chubu', name: '中部地方', prefectures: ['新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県', '岐阜県', '静岡県', '愛知県'] },
        { id: 'kinki', name: '近畿地方', prefectures: ['三重県', '滋賀県', '京都府', '大阪府', '兵庫県', '奈良県', '和歌山県'] },
        { id: 'chugoku', name: '中国地方', prefectures: ['鳥取県', '島根県', '岡山県', '広島県', '山口県'] },
        { id: 'shikoku', name: '四国地方', prefectures: ['徳島県', '香川県', '愛媛県', '高知県'] },
        { id: 'kyushu', name: '九州地方', prefectures: ['福岡県', '佐賀県', '長崎県', '熊本県', '大分県', '宮崎県', '鹿児島県'] },
      ];
      let activeScreen = 'products';

      function esc(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      async function api(path, options = {}) {
        let res;
        try {
          res = await fetch(`${WORKER_URL}${path}`, {
            ...options,
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', ...options.headers },
          });
        } catch {
          throw new Error('APIに接続できません。Worker Route（yellow-pearl.com/api/*）の設定を確認してください。');
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
        return data;
      }

      function showAuthError(msg) {
        document.getElementById('auth-error').style.display = 'block';
        document.getElementById('auth-error-msg').textContent = msg;
        document.getElementById('app').hidden = true;
      }

      function formatYen(n) {
        return Number(n ?? 0).toLocaleString('ja-JP');
      }

      function fmtNum(n) {
        return Number(n ?? 0).toLocaleString('ja-JP');
      }

      function switchScreen(name) {
        activeScreen = name;
        document.querySelectorAll('.screen').forEach((el) => {
          el.classList.toggle('active', el.id === `screen-${name}`);
        });
        document.querySelectorAll('.nav-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.screen === name);
        });
        document.getElementById('screen-title').textContent = SCREEN_TITLES[name] || '';
        if (name === 'stats') loadStats().catch((err) => alert(err.message));
        if (name === 'orders') loadOrders().catch((err) => alert(err.message));
      }

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchScreen(btn.dataset.screen));
      });

      function renderStats(data) {
        const chart = document.getElementById('year-bar-chart');
        const tbody = document.getElementById('stats-table-body');
        const yearly = data.yearly || [];

        if (!yearly.length) {
          chart.innerHTML = '<p class="empty-msg">昨年度までのデータがありません</p>';
          tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">データなし</td></tr>';
          return;
        }

        const maxCount = Math.max(...yearly.map((y) => y.order_count), 1);
        chart.innerHTML = yearly.map((y) => {
          const h = Math.round((y.order_count / maxCount) * 160);
          return `<div class="bar-col">
            <span class="bar-count">${y.order_count}件</span>
            <div class="bar-pillar" style="height:${h}px" title="${y.year}年: ${y.order_count}件"></div>
            <span class="bar-year">${y.year}</span>
          </div>`;
        }).join('');

        tbody.innerHTML = yearly.map((y) => `<tr>
          <td>${y.year}年度</td>
          <td class="num">${formatYen(y.order_count)}件</td>
          <td class="num">${formatYen(y.total_quantity)}本</td>
          <td class="num">¥${formatYen(y.amount)}</td>
        </tr>`).join('');
      }

      function formatRegionPrefs(prefectures) {
        return prefectures.map((p) => p.replace(/[都道府県]$/, '')).join('・');
      }

      function renderShippingGrid(regions) {
        const feeById = Object.fromEntries((regions || []).map((r) => [r.id, r.fee]));
        const grid = document.getElementById('shipping-grid');
        grid.innerHTML = SHIPPING_REGIONS.map((r) => `
          <div class="shipping-item">
            <label>
              <span class="shipping-region-name">${esc(r.name)}</span>
              <span class="shipping-region-prefs">${esc(formatRegionPrefs(r.prefectures))}</span>
            </label>
            <input type="number" min="0" data-region="${r.id}" value="${feeById[r.id] ?? 0}" />
          </div>
        `).join('');
      }

      async function loadStats() {
        const data = await api('/api/admin/stats');
        renderStats(data);
      }

      function formatAddress(o) {
        if (!o.postal && !o.prefecture && !o.address1) return '—';
        const line2 = o.address2 ? ` ${o.address2}` : '';
        return `〒${o.postal || ''} ${o.prefecture || ''}${o.address1 || ''}${line2}`.trim();
      }

      function formatContact(o) {
        if (!o.email && !o.phone) return '—';
        const kana = (o.last_name_kana || o.first_name_kana)
          ? `<br><span style="color:#888;font-size:0.8rem">${esc(o.last_name_kana)} ${esc(o.first_name_kana)}</span>`
          : '';
        const email = o.email ? `${esc(o.email)}` : '';
        const phone = o.phone ? `${o.email ? '<br>' : ''}${esc(o.phone)}` : '';
        return `${email}${phone}${kana}` || '—';
      }

      function statusPillClass(status) {
        if (status === '済み') return 'done';
        if (status === 'キャンセル') return 'cancelled';
        return 'reserved';
      }

      function renderOpsCell(o) {
        const status = o.status || '予約';
        if (status === 'キャンセル') {
          return `<div class="ops-cell ops-cell-cancelled" data-order-id="${esc(o.order_id)}">
            <div class="ops-actions">
              <button type="button" class="btn btn-primary ops-restore-btn"
                data-order-id="${esc(o.order_id)}"
                data-admin-note="${esc(o.admin_note || '')}">再予約</button>
              <button type="button" class="btn btn-danger ops-delete-btn"
                data-order-id="${esc(o.order_id)}">削除</button>
            </div>
          </div>`;
        }
        const options = ORDER_STATUSES.map((s) =>
          `<option value="${s}"${s === status ? ' selected' : ''}>${s}</option>`
        ).join('');
        return `<div class="ops-cell" data-order-id="${esc(o.order_id)}">
          <select class="ops-status">${options}</select>
          <textarea class="ops-note" placeholder="特記事項（管理者用）">${esc(o.admin_note || '')}</textarea>
          <button type="button" class="btn ops-save ops-save-btn" data-order-id="${esc(o.order_id)}">保存</button>
        </div>`;
      }

      function renderOrders(orders) {
        const tbody = document.getElementById('orders-table-body');
        const cards = document.getElementById('orders-cards');
        const emptyLabel = orderFilter === 'cancelled' ? 'キャンセルなし' : '予約なし';

        if (!orders.length) {
          tbody.innerHTML = `<tr><td colspan="8" class="empty-msg">${emptyLabel}</td></tr>`;
          cards.innerHTML = `<p class="empty-msg">${emptyLabel}</p>`;
          return;
        }

        tbody.innerHTML = orders.map((o) => {
          const note = o.note ? `<br><span style="color:#888">お客様備考: ${esc(o.note)}</span>` : '';
          const status = o.status || '予約';
          return `<tr data-order-id="${esc(o.order_id)}">
            <td class="mono">${esc(o.order_id)}</td>
            <td>${esc(o.last_name)} ${esc(o.first_name)}</td>
            <td>${formatContact(o)}</td>
            <td>${esc(formatAddress(o))}${note}</td>
            <td>${o.quantity}本</td>
            <td class="num">${o.total_amount ? `¥${formatYen(o.total_amount)}` : '—'}</td>
            <td style="white-space:nowrap">${esc(o.created_at)}</td>
            <td>${renderOpsCell(o)}</td>
          </tr>`;
        }).join('');

        cards.innerHTML = orders.map((o) => {
          const status = o.status || '予約';
          return `
          <article class="order-card" data-order-id="${esc(o.order_id)}">
            <div class="order-card-head">
              <div>
                <div class="order-card-name">${esc(o.last_name)} ${esc(o.first_name)}</div>
                <span class="status-pill ${statusPillClass(status)}">${esc(status)}</span>
                ${(o.last_name_kana || o.first_name_kana)
                  ? `<div style="font-size:0.8rem;color:#888">${esc(o.last_name_kana)} ${esc(o.first_name_kana)}</div>`
                  : ''}
              </div>
              <div class="order-card-id">${esc(o.order_id)}</div>
            </div>
            <dl class="order-card-dl">
              <dt>数量</dt><dd>${o.quantity}本</dd>
              <dt>合計</dt><dd>${o.total_amount ? `¥${formatYen(o.total_amount)}` : '—'}</dd>
              <dt>日時</dt><dd>${esc(o.created_at)}</dd>
              <dt>メール</dt><dd>${esc(o.email)}</dd>
              <dt>電話</dt><dd>${esc(o.phone)}</dd>
              <dt>住所</dt><dd>${esc(formatAddress(o))}</dd>
              ${o.note ? `<dt>お客様備考</dt><dd>${esc(o.note)}</dd>` : ''}
            </dl>
            ${renderOpsCell(o)}
          </article>
        `;
        }).join('');
      }

      function updateOrdersFilterUI() {
        const isCancelled = orderFilter === 'cancelled';
        document.getElementById('orders-list-title').textContent =
          isCancelled ? 'キャンセル一覧' : '予約一覧';
        document.getElementById('toggle-orders-filter-btn').textContent =
          isCancelled ? '予約一覧に戻る' : 'キャンセル一覧';
      }

      async function loadOrders() {
        const filter = orderFilter === 'cancelled' ? 'cancelled' : 'active';
        const data = await api(`/api/admin/orders?filter=${filter}`);
        updateOrdersFilterUI();
        renderOrders(data.orders ?? []);
      }

      async function saveOrder(orderId, container) {
        const status = container.querySelector('.ops-status').value;
        const adminNote = container.querySelector('.ops-note').value.trim();
        await api(`/api/admin/orders/${encodeURIComponent(orderId)}`, {
          method: 'PUT',
          body: JSON.stringify({ status, admin_note: adminNote }),
        });
        await loadOrders();
        await loadDashboard();
      }

      async function restoreOrder(btn) {
        const orderId = btn.dataset.orderId;
        if (!confirm('この予約を再予約（予約）に戻しますか？在庫が減ります。')) return;
        btn.disabled = true;
        try {
          await api(`/api/admin/orders/${encodeURIComponent(orderId)}`, {
            method: 'PUT',
            body: JSON.stringify({
              status: '予約',
              admin_note: btn.dataset.adminNote || '',
            }),
          });
          orderFilter = 'active';
          await loadOrders();
          await loadDashboard();
        } finally {
          btn.disabled = false;
        }
      }

      async function deleteOrder(btn) {
        const orderId = btn.dataset.orderId;
        if (!confirm('このキャンセル予約を完全に削除しますか？この操作は取り消せません。')) return;
        btn.disabled = true;
        try {
          await api(`/api/admin/orders/${encodeURIComponent(orderId)}`, {
            method: 'DELETE',
          });
          await loadOrders();
          await loadDashboard();
        } finally {
          btn.disabled = false;
        }
      }

      function handleOrdersClick(e) {
        const restoreBtn = e.target.closest('.ops-restore-btn');
        if (restoreBtn) {
          restoreOrder(restoreBtn).catch((err) => alert(err.message));
          return;
        }
        const deleteBtn = e.target.closest('.ops-delete-btn');
        if (deleteBtn) {
          deleteOrder(deleteBtn).catch((err) => alert(err.message));
          return;
        }
        const saveBtn = e.target.closest('.ops-save-btn');
        if (!saveBtn) return;
        const container = saveBtn.closest('.ops-cell');
        if (!container) return;
        saveBtn.disabled = true;
        saveOrder(saveBtn.dataset.orderId, container)
          .catch((err) => alert(err.message))
          .finally(() => { saveBtn.disabled = false; });
      }

      function renderDashboard(data) {
        const inv = data?.inventory ?? {};
        document.getElementById('stat-sold').textContent = fmtNum(data?.sold);
        document.getElementById('stat-stock').textContent = fmtNum(inv.stock);
        document.getElementById('stat-orders').textContent = fmtNum(data?.order_count);

        document.getElementById('edit-stock').value = inv.stock ?? 0;
        document.getElementById('edit-unit-price').value = inv.unit_price ?? 0;
        document.getElementById('edit-tax-rate').value = inv.tax_rate ?? 10;
        document.getElementById('edit-sold-out').checked = !!inv.sold_out;

        const badge = document.getElementById('status-badge');
        if (inv.sold_out || inv.stock <= 0) {
          badge.textContent = '受付終了';
          badge.classList.add('sold-out');
        } else {
          badge.textContent = '受付中';
          badge.classList.remove('sold-out');
        }

        renderShippingGrid(data.shipping_regions ?? []);
        if (activeScreen === 'orders') loadOrders().catch(() => {});
      }

      async function loadDashboard() {
        const data = await api('/api/admin/dashboard');
        renderDashboard(data);
        document.getElementById('app').hidden = false;
      }

      document.getElementById('refresh-btn').addEventListener('click', async () => {
        try {
          await loadDashboard();
          if (activeScreen === 'stats') await loadStats();
          if (activeScreen === 'orders') await loadOrders();
        } catch (err) {
          alert(err.message);
        }
      });

      document.getElementById('inventory-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('inventory-error');
        const okEl = document.getElementById('inventory-success');
        const btn = document.getElementById('save-btn');
        errEl.textContent = '';
        okEl.textContent = '';
        btn.disabled = true;

        try {
          await api('/api/admin/inventory', {
            method: 'PUT',
            body: JSON.stringify({
              stock: parseInt(document.getElementById('edit-stock').value, 10),
              unit_price: parseInt(document.getElementById('edit-unit-price').value, 10),
              tax_rate: parseInt(document.getElementById('edit-tax-rate').value, 10),
              sold_out: document.getElementById('edit-sold-out').checked,
            }),
          });
          okEl.textContent = '在庫を更新しました';
          await loadDashboard();
        } catch (err) {
          errEl.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('shipping-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('shipping-error');
        const okEl = document.getElementById('shipping-success');
        const btn = document.getElementById('save-shipping-btn');
        errEl.textContent = '';
        okEl.textContent = '';
        btn.disabled = true;

        const rates = [...document.querySelectorAll('#shipping-grid input')].map((el) => ({
          region: el.dataset.region,
          fee: parseInt(el.value, 10) || 0,
        }));

        try {
          const data = await api('/api/admin/shipping', {
            method: 'PUT',
            body: JSON.stringify({ rates }),
          });
          renderShippingGrid(data.shipping_regions ?? []);
          okEl.textContent = '送料を保存しました';
        } catch (err) {
          errEl.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('toggle-orders-filter-btn').addEventListener('click', () => {
        orderFilter = orderFilter === 'cancelled' ? 'active' : 'cancelled';
        loadOrders().catch((err) => alert(err.message));
      });

      document.getElementById('orders-table-body').addEventListener('click', handleOrdersClick);
      document.getElementById('orders-cards').addEventListener('click', handleOrdersClick);

      loadDashboard().catch((err) => showAuthError(err.message));
    </script>
  </body>
</html>
